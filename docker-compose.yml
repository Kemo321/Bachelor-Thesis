services:
  yolo-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: yolo-bachelor-thesis:latest
    container_name: yolo_dev_container

    shm_size: '32gb'

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - CCACHE_DIR=/ccache
      - CCACHE_MAXSIZE=10G
      - CMAKE_C_COMPILER_LAUNCHER=ccache
      - CMAKE_CXX_COMPILER_LAUNCHER=ccache
      - CMAKE_CUDA_COMPILER_LAUNCHER=ccache

    volumes:
      - .:/app
      - build_cache:/app/build
      - ccache_data:/ccache

    working_dir: /app
    tty: true
    stdin_open: true

    # Incremental builds live in the build_cache volume.
    # ./scripts/dev.sh  — configure, ninja, unit tests
    # ./scripts/menu.sh — interactive run menu
    command: ["/bin/bash"]

volumes:
  build_cache:
  ccache_data:
