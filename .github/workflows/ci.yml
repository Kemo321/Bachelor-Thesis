name: Deep Learning Framework CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis:
    name: Static Analysis (Format & Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck python3-pip
          python3 -m pip install --user clang-format==18.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run clang-format
        run: |
          find . \( -name "*.cpp" -o -name "*.hpp" -o -name "*.cu" -o -name "*.cuh" -o -name "*.cc" \) \
            -not -path "*/build/*" -not -path "*/extern/*" -not -path "*/torch_baseline/*" \
            | xargs clang-format -style=file --dry-run --Werror

      - name: Run Cppcheck
        run: |
          cppcheck --enable=warning --inline-suppr \
            --suppressions-list=.cppcheck_suppressions \
            --suppress=shiftTooManyBits \
            --error-exitcode=1 \
            -I include \
            -i src/dataset.cpp \
            -i src/utils.cpp \
            src/

  build-debug:
    name: Build & Test (Debug)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
    steps:
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git cmake g++ ninja-build ca-certificates

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-debug-cuda12.4

      - name: Configure CMake (Debug)
        run: |
          cmake -B build_debug -S . -G Ninja \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUSE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DTORCH_CUDA_ARCH_LIST=7.5 \
            -DUSE_SANITIZERS=OFF \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build (Debug)
        run: cmake --build build_debug

      - name: Run unit tests
        run: |
          cd build_debug
          ctest --output-on-failure -j $(nproc)

      - name: Generate lcov report
        if: always()
        run: |
          apt-get update
          apt-get install -y --no-install-recommends lcov
          lcov --capture --directory build_debug --output-file coverage.info \
            --rc lcov_branch_coverage=1 --ignore-errors gcov,mismatch,source,unused || true
          lcov --remove coverage.info \
            '/usr/*' '*/extern/*' '*/tests/*' '*/googletest/*' '*/highway/*' \
            --output-file coverage.filtered.info \
            --ignore-errors unused || true
          genhtml coverage.filtered.info --output-directory coverage-html --ignore-errors source || true
          mkdir -p coverage-html
          if [ -f coverage.filtered.info ]; then cp coverage.filtered.info coverage-html/; fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: coverage-html
          if-no-files-found: ignore

  build-release:
    name: Build & Benchmark (Release)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
    steps:
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git cmake g++ ninja-build ca-certificates

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-release-cuda12.4

      - name: Configure CMake (Release)
        run: |
          cmake -B build_release -S . -G Ninja \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DTORCH_CUDA_ARCH_LIST=7.5

      - name: Build (Release)
        run: cmake --build build_release --target dllib_tests

      - name: Check Benchmarks
        run: |
          if [ -x ./build_release/benchmarks/bench_custom ]; then
            ./build_release/benchmarks/bench_custom --benchmark_min_time=0.01 || true
          else
            echo "Custom benchmarks not built (OpenCV missing); skipping."
          fi
