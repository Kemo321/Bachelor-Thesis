name: Deep Learning Framework CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  static-analysis:
    name: Static Analysis (Format & Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck python3-pip
          python3 -m pip install --user clang-format==18.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run clang-format
        run: |
          find . \( -name "*.cpp" -o -name "*.hpp" -o -name "*.cu" -o -name "*.cuh" -o -name "*.cc" \) \
            -not -path "*/build/*" -not -path "*/extern/*" -not -path "*/torch_baseline/*" \
            | xargs clang-format -style=file --dry-run --Werror

      - name: Run Cppcheck
        run: |
          cppcheck --enable=warning --inline-suppr \
            --suppressions-list=.cppcheck_suppressions \
            --suppress=shiftTooManyBits \
            --error-exitcode=1 \
            -I include \
            -i src/dataset.cpp \
            -i src/utils.cpp \
            src/

  build-debug:
    name: Build & Test (Debug)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
    steps:
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git cmake g++ ninja-build ca-certificates lcov libtbb-dev

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Init required submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 \
            extern/googletest \
            extern/highway \
            extern/benchmark \
            extern/pugixml \
            extern/stb

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-debug-cuda12.4

      - name: Configure CMake (Debug)
        run: |
          cmake -B build_debug -S . -G Ninja \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUSE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DTORCH_CUDA_ARCH_LIST=7.5 \
            -DUSE_SANITIZERS=OFF \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build (Debug)
        id: build
        run: cmake --build build_debug --target dllib_tests

      - name: Run unit tests
        run: |
          test -x build_debug/tests/dllib_tests
          ./build_debug/tests/dllib_tests | tee gtest.log
          {
            echo "## Unit tests"
            echo
            echo '```'
            grep -E '\[==========\]|\[  PASSED  \]|\[  FAILED  \]|\[  SKIPPED \]' gtest.log | tail -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE '\[  SKIPPED \]' gtest.log; then
            echo "::warning::GPU tests were skipped. This GitHub runner has no NVIDIA device, so CUDA coverage is incomplete."
          fi

      - name: Generate lcov report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          lcov --version
          find build_debug -name '*.gcda' | tee gcda-files.txt
          if [ ! -s gcda-files.txt ]; then
            echo "::error::No .gcda files after tests. Coverage instrumentation did not run."
            exit 1
          fi
          # Ubuntu 22.04 ships lcov 1.15: only gcov,source,graph are valid --ignore-errors values.
          lcov --capture --directory build_debug --output-file coverage.info \
            --rc lcov_branch_coverage=1 --ignore-errors gcov,source
          lcov --extract coverage.info '*/src/*' '*/include/*' '*/tests/*' \
            --output-file coverage.filtered.info \
            --rc lcov_branch_coverage=1
          test -s coverage.filtered.info
          genhtml coverage.filtered.info --output-directory coverage-html \
            --rc lcov_branch_coverage=1 --ignore-errors source \
            --title "DeepLearnLib coverage"
          cp coverage.info coverage.filtered.info coverage-html/
          {
            echo "## Coverage (lcov 1.15, no GPU)"
            echo
            echo '```'
            lcov --summary coverage.filtered.info
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: coverage-html
          if-no-files-found: error

  build-release:
    name: Build & Benchmark (Release)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
    steps:
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git cmake g++ ninja-build ca-certificates libopencv-dev pkg-config libtbb-dev

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Init required submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 \
            extern/googletest \
            extern/highway \
            extern/benchmark \
            extern/pugixml \
            extern/stb

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-release-cuda12.4

      - name: Configure CMake (Release)
        run: |
          cmake -B build_release -S . -G Ninja \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DTORCH_CUDA_ARCH_LIST=7.5

      - name: Build library, tests, and custom benchmarks
        run: |
          cmake --build build_release \
            --target dllib_tests \
            --target bench_voc_custom \
            --target short_voc_custom \
            --target overfit_voc_custom \
            --target train_synthetic_custom \
            --target train_tabular_custom \
            --target train_cifar_custom \
            --target train_mnist_custom \
            --target train_voc_custom

      - name: Verify benchmark binaries
        run: |
          test -x build_release/tests/dllib_tests
          test -x build_release/benchmarks/bench_voc_custom
          test -x build_release/benchmarks/short_voc_custom
          test -x build_release/benchmarks/overfit_voc_custom
          test -x build_release/benchmarks/train_synthetic_custom
          test -x build_release/benchmarks/train_tabular_custom
          test -x build_release/benchmarks/train_cifar_custom
          test -x build_release/benchmarks/train_mnist_custom
          test -x build_release/benchmarks/train_voc_custom
          ls -l build_release/benchmarks/
          echo "::notice::Benchmark binaries compiled. Not executed: GitHub-hosted runners have no NVIDIA GPU."
          {
            echo "## Release binaries"
            echo
            echo "Compiled \`dllib_tests\` and custom benchmarks. GPU execution is local-only."
          } >> "$GITHUB_STEP_SUMMARY"
